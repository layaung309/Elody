<!DOCTYPE html>
<html>
<head>
  <title>Measurement Converter</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function inchToCm() {
      // Get the value from input
      let inch = document.getElementById("inchInput").value;
      // Convert inch to cm (1 inch = 2.54 cm)
      let cm = inch * 2.54;
      // Display result
      document.getElementById("result").innerHTML = inch + " inch = " + cm.toFixed(2) + " cm";
    }
  </script>
</head>
<body>
  <h2>Measurement Converter</h2>
  <label for="inchInput">Enter Inch:</label>
  <input type="number" id="inchInput" placeholder="Enter value">
  <button onclick="inchToCm()">Convert</button>
  <p id="result"></p>

</script>
<button onclick="window.location.href='index.html'">
    Back
</button>

</body>
</html>
